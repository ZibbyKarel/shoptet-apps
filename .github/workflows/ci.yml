# Garage — continuous integration.
#
# Four jobs, run in parallel, each gating something the others structurally
# cannot see:
#
#   verify    formatting, lint, typecheck, the unit suites, both builds and
#             both Storybooks. No Docker, no database — this is the fast lane.
#   database  the eight `*.db.spec.ts` suites, against a real PostgreSQL 17.
#   e2e       the API over HTTP and the eight browser journeys, against a real
#             PostgreSQL 17 and a real OIDC issuer.
#   images    the two production images actually build.
#
# `database` is not a nicety. `apps/garage/api/jest.config.cts` **excludes**
# `*.db.spec.ts` from `api:test`, so without this job a green build would mean
# nothing about the part of the reservations module whose correctness *is* the
# database: `SELECT … FOR UPDATE`, transaction isolation, and the waitlist
# promotion that shares a cancellation's transaction. Those cannot be covered
# by a test double — a double cannot take a row lock — so the only way to test
# them is to run them.
#
# `e2e` is not a nicety either, and its absence used to be invisible in exactly
# the way this header is meant to prevent: the sentence above once said "three
# jobs, each gating something the others structurally cannot see", which was
# true of the three that existed and silent about the layer that was not there.
# Sign-in through a real OIDC redirect, sign-out durability, the cell-lock
# broadcast, waitlist promotion through the UI and the ICS feed's
# token-only-credential model are exercised end to end **only** in
# `apps/garage/web-e2e`, and `apps/garage/api-e2e` is the only place the API is spoken to
# over HTTP with a real token. Neither ran here; both ran when a developer
# remembered. `doc/decision/0286-*`.
#
# Every command here is one a developer runs locally, unchanged. Nothing in
# this file is CI-only behaviour in the application.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege, set once at the top so no job can quietly inherit more.
# Nothing here writes: `verify` and `database` only read the checkout, and
# `images` builds with `push: false`, so it needs no registry or package
# scope either. A job that later needs to comment on a pull request or push a
# tag should be given that scope in its own `permissions:` block rather than
# widening this one.
permissions:
  contents: read

# A new push to a branch cancels the run already in flight for it. Never on
# `main`, where every commit's result is a record.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # `.nvmrc` is the single source of truth for the Node major, shared
          # with both Dockerfiles (`node:24-alpine`).
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # `--all`, not the default: without a base ref to diff against, plain
      # `nx format:check` checks nothing at all on a fresh checkout and passes
      # vacuously.
      - run: npx nx format:check --all

      # `build-storybook` is on this list because `npm run build` — what a
      # developer runs — is `-t build,build-storybook`, and this job ran only
      # `build`. `plan.md` makes a story mandatory for every primitive and
      # every compound, so a broken story is a broken deliverable; without it
      # here, one reaches `main` and the first person to notice is whoever runs
      # the local script next.
      - run: npx nx run-many -t lint,typecheck,test,build,build-storybook

  database:
    name: database suites (api:test-db)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: garage
          POSTGRES_PASSWORD: garage_ci
          POSTGRES_DB: garage
        ports:
          - 5432:5432
        # Without a health check the job would start `npm ci` and reach the
        # tests before Postgres finished its own initdb, and the failure would
        # look like a flaky test rather than a race in this file.
        options: >-
          --health-cmd "pg_isready -U garage -d garage"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # These credentials are a throwaway container's, created and destroyed
      # inside this job. They are not a secret and must not be turned into one:
      # a `secrets.` reference here would make the job unrunnable from a fork
      # and hide what it connects to.
      DATABASE_URL: postgresql://garage:garage_ci@localhost:5432/garage

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # No migration step: `apps/garage/api/src/testing/database/global-setup.ts`
      # creates a throwaway database per run, applies the committed migrations
      # to it and repoints `DATABASE_URL` at it — and **throws** when
      # `DATABASE_URL` is absent rather than skipping, which is what makes an
      # unreachable Postgres fail this job instead of silently passing it.
      - run: npx nx run api:test-db

      # `schema.prisma` is the artefact both parity suites derive from and
      # neither checks: `schema-contract-parity.spec.ts` compares the *committed
      # generated client* against the contract, and `migration-sql.spec.ts`
      # never reads the schema at all. So editing the schema without running
      # `prisma generate`, or without writing the migration, leaves both suites
      # green and surfaces at runtime as `P2022`/`P2021`. This target closes
      # that: `migrate diff --exit-code` catches a schema the migrations do not
      # reproduce, and `prisma generate && git diff --exit-code` catches a
      # generated client that is behind. `doc/decision/0277-*`.
      #
      # It runs here rather than in `verify` because it needs a live PostgreSQL,
      # which only this job has.
      #
      # The migration step above it is **required**, and its absence made the
      # first version of this step fail on every run. The comment on `api:test-db`
      # explains why that target needs no migration: it builds a throwaway
      # database per run and repoints `DATABASE_URL` **in-process**. So the
      # database this job's `DATABASE_URL` actually names is still empty when
      # `api:test-db` finishes, and `check-schema` compares the schema against
      # nothing: `migrate status` exits 1 and `migrate diff --exit-code` exits 2.
      # Measured both ways — empty database exit 1, same database after
      # `migrate deploy` exit 0.
      - run: npx prisma migrate deploy
      - run: npx nx run database:check-schema

  e2e:
    name: end-to-end (api-e2e, web-e2e)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: garage
          POSTGRES_PASSWORD: garage_ci
          POSTGRES_DB: garage
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U garage -d garage"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # The same issuer `docker compose --profile dev` starts, run the same
      # way: no `JSON_CONFIG`, so its defaults apply and `personas.ts` supplies
      # the `email` and `name` claims through the sign-in form's optional-claims
      # field, exactly as it does locally (`doc/decision/0180-*`).
      #
      # It builds every URL it publishes — the authorization endpoint, the JWKS
      # URI, the `iss` claim — from the Host header of the request it answers
      # (`docker-compose.yml`, and `doc/decision/0201-*`). Here the browser, the
      # API and the web app all reach it as `localhost:8080`, so there is one
      # name and no mismatch. No health check: the image ships none, and the
      # step below waits on its discovery document instead, which is a stronger
      # statement than a TCP connect.
      mock-oauth2-server:
        image: ghcr.io/navikt/mock-oauth2-server:latest
        ports:
          - 8080:8080

    # These are the values in `.env.example`, which is what a developer runs
    # against, minus the log level. They are a throwaway container's and a mock
    # issuer's — not secrets, and they must not become `secrets.` references
    # for the same reason the `database` job's are not: it would make this job
    # unrunnable from a fork and hide what it connects to. `AUTH_SECRET` is
    # long enough for `webEnvSchema`'s 32-character minimum and signs sessions
    # that exist for the length of one job.
    env:
      NODE_ENV: development
      PORT: '3000'
      DATABASE_URL: postgresql://garage:garage_ci@localhost:5432/garage
      AUTH_OKTA_ISSUER: http://localhost:8080/default
      AUTH_OKTA_AUDIENCE: default
      CORS_ALLOWED_ORIGINS: http://localhost:4200
      # `info` locally; `warn` here, because the API logs one line per request
      # and the browser suite makes several hundred.
      LOG_LEVEL: warn
      NEXT_PUBLIC_API_URL: http://localhost:3000/api
      AUTH_SECRET: ci-e2e-secret-not-a-real-secret-0123456789
      AUTH_OKTA_CLIENT_ID: garage-web-dev
      AUTH_OKTA_CLIENT_SECRET: garage-web-dev-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Chromium only, matching `playwright.config.mts`: this suite drives two
      # and three concurrent sessions against one database, so a second and
      # third browser would triple the contention for no coverage
      # (`doc/decision/0182-*`). `--with-deps` installs the system libraries
      # the runner image does not carry.
      - run: npx playwright install --with-deps chromium

      # Unlike the `database` job, nothing here creates its own schema:
      # `api-e2e` talks to a booted API over HTTP and `web-e2e` drives a
      # browser, so both need the real database migrated and seeded first. The
      # seed is what makes `dev-admin` an admin — the role is a column, and no
      # token can grant it.
      - run: npx prisma migrate deploy
      - run: npx prisma db seed

      # The issuer answers its discovery document only once it has finished
      # starting. Without this the first sign-in would fail as a mysterious
      # test failure rather than as a service that was not up yet.
      - name: wait for the mock OIDC issuer
        run: |
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:8080/default/.well-known/openid-configuration > /dev/null; then
              echo "issuer ready"
              exit 0
            fi
            sleep 2
          done
          echo "mock-oauth2-server did not answer its discovery document in 120s"
          exit 1

      # In this order, and in separate steps, because `api-e2e`'s teardown
      # kills whatever holds port 3000 and `web-e2e` then has Nx start its own
      # API. Neither carries `continue-on-error`: a red journey here is a red
      # build, which is the whole point of the job.
      - run: npx nx run api-e2e:e2e
      - run: npx nx run web-e2e:e2e

      # The report and the traces are the only way to read a browser failure
      # that did not happen on your machine. `if: failure()` because on a green
      # run they are noise.
      - name: playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: dist/.playwright/apps/garage/web-e2e
          retention-days: 7

  images:
    name: production images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # No `push`, no registry, no credentials: this job answers one question —
      # does the deployable artifact still build from a clean context? The
      # `.dockerignore` that keeps `.env` out of that context is part of what
      # is being exercised.
      - name: api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/garage/api/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: migrator
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/garage/api/Dockerfile
          target: migrator
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/garage/web/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
